<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Deep read placeholder">
  <rect width="480" height="270" fill="#f8fafc"/>
  <rect x="30" y="25" width="420" height="40" rx="6" fill="white" stroke="#cbd5e1"/>
  <text x="45" y="50" font-family="ui-sans-serif,system-ui" font-size="12" fill="#0f172a">
    Q: Which papers report attention-head pruning gains &gt; 30%?
  </text>

  <g font-family="ui-sans-serif,system-ui" font-size="11">
    <rect x="30" y="85" width="130" height="50" rx="4" fill="white" stroke="#cbd5e1"/>
    <text x="40" y="103" fill="#334155">BERT.pdf</text>
    <text x="40" y="120" fill="#64748b" font-size="10">cited p.7</text>

    <rect x="175" y="85" width="130" height="50" rx="4" fill="white" stroke="#cbd5e1"/>
    <text x="185" y="103" fill="#334155">ALBERT.pdf</text>
    <text x="185" y="120" fill="#64748b" font-size="10">cited p.3</text>

    <rect x="320" y="85" width="130" height="50" rx="4" fill="white" stroke="#cbd5e1"/>
    <text x="330" y="103" fill="#334155">RoBERTa.pdf</text>
    <text x="330" y="120" fill="#64748b" font-size="10">cited p.5</text>

    <rect x="30" y="155" width="420" height="85" rx="6" fill="white" stroke="#2563eb"/>
    <text x="45" y="180" fill="#0f172a">A: Three papers report &gt;30% gains: ALBERT (38%),</text>
    <text x="45" y="200" fill="#0f172a">Voita et al. (54%), and BERT-pruned (31%).</text>
    <text x="45" y="225" fill="#64748b" font-size="10">3 sources cited</text>
  </g>
</svg>
