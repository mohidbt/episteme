name: dependency-audit

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "services/agents/pyproject.toml"
      - "services/agents/uv.lock"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  node-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit

  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      - run: uv export --frozen --no-dev --format requirements-txt --output-file /tmp/requirements.txt
      - run: uvx pip-audit==2.9.0 -r /tmp/requirements.txt
