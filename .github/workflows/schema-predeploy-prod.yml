name: schema-predeploy-prod

permissions:
  contents: read

# Always triggers so it can be marked as a required check without
# deadlocking PRs that don't touch DB code. The job itself skips the
# actual predeploy-check when no relevant paths changed.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  predeploy-check-prod:
    name: db predeploy check (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: predeploy-prod-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "push to main, always running prod gate"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" || true
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(packages/db/|\.github/workflows/schema-predeploy-prod\.yml$|pnpm-lock\.yaml$)' >/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "no DB-related changes, skipping prod gate"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      # Never run PR-controlled package lifecycle scripts or TypeScript with a
      # production credential. PRs are covered by schema-predeploy-gate against
      # an isolated Postgres service; the live check runs only after merge.
      - name: Guard - secret available
        if: steps.changes.outputs.relevant == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_URL: ${{ github.event_name == 'push' && secrets.PROD_DATABASE_URL || '' }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Production credentials are never exposed to pull-request code."
            echo "SKIP_PROD_CHECK=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "${DATABASE_URL}" ]; then
            exit 0
          fi
          echo "::error::PROD_DATABASE_URL is empty on push to main. Set the secret in repo settings."
          exit 1

      - name: Setup pnpm
        if: steps.changes.outputs.relevant == 'true' && env.SKIP_PROD_CHECK != '1'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.12.0

      - name: Setup Node
        if: steps.changes.outputs.relevant == 'true' && env.SKIP_PROD_CHECK != '1'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        if: steps.changes.outputs.relevant == 'true' && env.SKIP_PROD_CHECK != '1'
        run: pnpm install --frozen-lockfile

      - name: Predeploy check against prod
        if: steps.changes.outputs.relevant == 'true' && env.SKIP_PROD_CHECK != '1'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm db:predeploy-check
