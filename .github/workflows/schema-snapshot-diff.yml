name: schema-snapshot-diff

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  snapshot-diff:
    name: structural schema diff vs baseline
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Diff prod schema against baseline
        run: pnpm --filter @episteme/db db:snapshot-diff
