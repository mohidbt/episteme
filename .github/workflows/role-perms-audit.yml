name: role-perms-audit

on:
  pull_request:
    paths:
      - "packages/db/ops/split-roles.sql"
      - ".github/workflows/role-perms-audit.yml"
  push:
    branches: [main]
    paths:
      - "packages/db/ops/split-roles.sql"
      - ".github/workflows/role-perms-audit.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  perms-audit:
    name: role permissions audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: app_runtime cannot DDL
        env:
          PGURL: ${{ secrets.APP_RUNTIME_DATABASE_URL }}
        run: |
          set -e
          if /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 -c "create table public.audit_should_fail (x int);" 2>/dev/null; then
            echo "FAIL: app_runtime was able to CREATE TABLE"
            /usr/lib/postgresql/17/bin/psql "$PGURL" -c "drop table if exists public.audit_should_fail;" 2>/dev/null || true
            exit 1
          fi
          echo "OK: app_runtime denied CREATE TABLE"

      - name: app_runtime cannot read drizzle schema
        env:
          PGURL: ${{ secrets.APP_RUNTIME_DATABASE_URL }}
        run: |
          set -e
          if /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 -c "select count(*) from drizzle.__drizzle_migrations;" 2>/dev/null; then
            echo "FAIL: app_runtime was able to read drizzle.__drizzle_migrations"
            exit 1
          fi
          echo "OK: app_runtime denied drizzle schema access"

      - name: app_runtime can DML on public
        env:
          PGURL: ${{ secrets.APP_RUNTIME_DATABASE_URL }}
        run: |
          set -e
          /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 -c "select count(*) from public.papers;" > /dev/null
          /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 -tA <<'SQL'
            do $$ begin
              if not (has_table_privilege('app_runtime', 'public.papers', 'SELECT')
                  and has_table_privilege('app_runtime', 'public.papers', 'INSERT')
                  and has_table_privilege('app_runtime', 'public.papers', 'UPDATE')
                  and has_table_privilege('app_runtime', 'public.papers', 'DELETE')) then
                raise exception 'app_runtime missing DML on public.papers';
              end if;
            end $$;
          SQL
          echo "OK: app_runtime has full DML on public.papers"

      - name: humans_ro cannot write
        env:
          PGURL: ${{ secrets.HUMANS_RO_DATABASE_URL }}
        run: |
          set -e
          /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 -c "select count(*) from public.papers;" > /dev/null
          if /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 -c "delete from public.papers where id = '00000000-0000-0000-0000-000000000000';" 2>/dev/null; then
            echo "FAIL: humans_ro was able to DELETE"
            exit 1
          fi
          echo "OK: humans_ro denied DELETE"

      - name: migrate_only retains DDL
        env:
          PGURL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          set -e
          /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
            create table public.audit_migrate_only_temp (x int);
            drop table public.audit_migrate_only_temp;
          SQL
          echo "OK: migrate_only CREATE+DROP works"

      - name: PUBLIC has no grants on public/drizzle schemas
        env:
          PGURL: ${{ secrets.HUMANS_RO_DATABASE_URL }}
        run: |
          set -e
          COUNT=$(/usr/lib/postgresql/17/bin/psql "$PGURL" -tA -c "select count(*) from information_schema.role_table_grants where grantee = 'PUBLIC' and table_schema in ('public', 'drizzle');")
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: PUBLIC has $COUNT grants on public/drizzle"
            exit 1
          fi
          echo "OK: PUBLIC has zero grants on public/drizzle"

      - name: app_runtime cannot CREATE SCHEMA
        env:
          PGURL: ${{ secrets.APP_RUNTIME_DATABASE_URL }}
        run: |
          set -e
          if /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 -c "create schema audit_schema_should_fail;" 2>/dev/null; then
            echo "FAIL: app_runtime created schema"
            /usr/lib/postgresql/17/bin/psql "$PGURL" -c "drop schema if exists audit_schema_should_fail;" 2>/dev/null || true
            exit 1
          fi
          echo "OK: app_runtime denied CREATE SCHEMA"

      - name: app_runtime has DML on ALL public tables
        env:
          PGURL: ${{ secrets.APP_RUNTIME_DATABASE_URL }}
        run: |
          set -e
          GAPS=$(/usr/lib/postgresql/17/bin/psql "$PGURL" -tA <<'SQL'
            select t.table_schema || '.' || t.table_name
            from information_schema.tables t
            where t.table_schema = 'public'
              and t.table_type = 'BASE TABLE'
              and not (
                has_table_privilege('app_runtime', t.table_schema || '.' || t.table_name, 'SELECT')
                and has_table_privilege('app_runtime', t.table_schema || '.' || t.table_name, 'INSERT')
                and has_table_privilege('app_runtime', t.table_schema || '.' || t.table_name, 'UPDATE')
                and has_table_privilege('app_runtime', t.table_schema || '.' || t.table_name, 'DELETE')
              );
          SQL
          )
          if [ -n "$GAPS" ]; then
            echo "FAIL: app_runtime missing DML on these tables:"
            echo "$GAPS"
            exit 1
          fi
          echo "OK: app_runtime has full DML on every public table"

      - name: app_runtime scoped to public schema only
        env:
          PGURL: ${{ secrets.HUMANS_RO_DATABASE_URL }}
        run: |
          set -e
          EXTRA=$(/usr/lib/postgresql/17/bin/psql "$PGURL" -tA -c "
            select n.nspname
            from pg_namespace n
            where has_schema_privilege('app_runtime', n.nspname, 'USAGE')
              and n.nspname not in ('public', 'pg_catalog', 'information_schema');
          ")
          if [ -n "$EXTRA" ]; then
            echo "FAIL: app_runtime has USAGE on unexpected schemas: $EXTRA"
            exit 1
          fi
          echo "OK: app_runtime scoped to public schema only"

      - name: SECURITY DEFINER function inventory (informational)
        env:
          PGURL: ${{ secrets.HUMANS_RO_DATABASE_URL }}
        run: |
          set -e
          echo "SECURITY DEFINER functions in public (informational only):"
          /usr/lib/postgresql/17/bin/psql "$PGURL" -tA -c "
            select p.proname, r.rolname as owner
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            join pg_roles r on r.oid = p.proowner
            where n.nspname = 'public' and p.prosecdef = true
            order by p.proname;
          "

      - name: neondb_owner is member of migrate_only
        env:
          PGURL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          set -e
          HAS=$(/usr/lib/postgresql/17/bin/psql "$PGURL" -tA -c "
            select count(*) from pg_auth_members am
            join pg_roles parent on parent.oid = am.roleid
            join pg_roles child on child.oid = am.member
            where parent.rolname = 'migrate_only' and child.rolname = 'neondb_owner';
          ")
          if [ "$HAS" != "1" ]; then
            echo "FAIL: neondb_owner is not a member of migrate_only — SET ROLE pattern broken"
            exit 1
          fi
          echo "OK: neondb_owner -> migrate_only membership intact"
