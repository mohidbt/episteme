name: snapshot-refresh

permissions:
  contents: read

# After a successful prod migration, refresh packages/db/schema-snapshot.sql
# from the live DB. Commits the snapshot back to main (signed by github-actions
# bot) so nightly snapshot-diff stays clean.
on:
  workflow_dispatch:
  # Auto-chain: after apply-migrations succeeds on main, refresh snapshot
  # so the nightly schema-snapshot-diff doesn't false-positive next push.
  workflow_run:
    workflows: ["apply-migrations"]
    types: [completed]
    branches: [main]

jobs:
  refresh:
    name: refresh schema snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual dispatch always runs; chained run only if upstream succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: pnpm }
      - name: Install pg17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Refresh snapshot
        env:
          PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
        run: pnpm --filter @episteme/db db:snapshot-dump
      - name: Commit + push
        run: |
          if git diff --quiet -- packages/db/schema-snapshot.sql; then
            echo "no snapshot changes"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/db/schema-snapshot.sql
          git commit -m "chore(db): refresh schema-snapshot.sql after prod migrate"
          git push origin HEAD:main
