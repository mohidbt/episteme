services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: episteme
      POSTGRES_PASSWORD: episteme
      POSTGRES_DB: episteme
    ports:
      - "5433:5432"
    volumes:
      - episteme_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: episteme
      MINIO_ROOT_PASSWORD: episteme-dev
    command: server /data --console-address ':9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 episteme episteme-dev &&
      mc mb --ignore-existing local/episteme-dev
      "

volumes:
  episteme_pgdata:
  minio-data:
