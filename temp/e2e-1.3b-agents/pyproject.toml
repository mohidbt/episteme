[project]
name = "episteme-e2e-1.3b"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
testpaths = ["."]
addopts = "-v --tb=short"
