[project]
name = "inhale-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "asyncpg",
    "pgvector",
    "httpx",
    "pydantic",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai",
    "pypdf",
    "pdfplumber>=0.11,<1.0",
    "datalab-python-sdk>=0.5.0",
    "deepagents>=0.5.3,<0.6",
    "langgraph-checkpoint-postgres>=3.0.5,<4.0",
    "psycopg[binary]>=3.2",
    "langchain-mcp-adapters>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]
