[project]
name = "inhale-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "asyncpg",
    "pgvector",
    "httpx",
    "pydantic",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai",
    "langchain-text-splitters",
    "pypdf",
    "pdfplumber>=0.11,<1.0",
    "datalab-python-sdk>=0.5.0",
    "deepagents>=0.5.3,<0.6",
    "langgraph-checkpoint-postgres>=3.0.5,<4.0",
    "psycopg[binary]>=3.2",
    "langchain-mcp-adapters>=0.2.2",
    "tavily-python>=0.5.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]

# Security floors for transitive runtime dependencies. Keep these as uv
# constraints instead of pretending they are imported directly by this
# service; `uv lock` still resolves them against Deep Agents/FastAPI's declared
# compatibility ranges.
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.1",
    "click>=8.3.3",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "langchain>=1.3.9,<2.0",
    "langchain-anthropic>=1.4.6,<2.0",
    "langchain-core>=1.3.3,<2.0",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.3.15",
    "langsmith>=0.8.18",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=6.13.3",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]
